spring.application.name=demo
spring.datasource.url=jdbc:sqlite:tasks.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# tasks.db — a file that will be created in your project folder (this IS your database)
# ddl-auto=update — Spring will auto-create the table for you based on your Task class
# show-sql=true — prints the SQL commands in terminal, helpful for learning