spring.application.name=task-api
# =====================================================================
# application.properties
# =====================================================================
# This file configures HOW your Spring Boot app behaves when it starts.
# Think of it as a settings/preferences file. Spring Boot automatically
# reads this file on startup - you never need to "import" it anywhere.
#
# Lines starting with "#" are comments and are ignored by Spring.
# =====================================================================

# ---------------------------------------------------------------------
# DATABASE CONNECTION SETTINGS
# ---------------------------------------------------------------------

# The location of our SQLite database file. "tasks.db" is just a file
# that will be created automatically in your project's root folder the
# first time you run the app. This file IS your entire database - you
# can literally open it with DB Browser for SQLite.
spring.datasource.url=jdbc:sqlite:tasks.db

# Tells Spring which "driver" (translator) to use to talk to SQLite
# specifically, since different databases (MySQL, Postgres, SQLite...)
# all speak slightly different dialects of SQL.
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate (the library that converts our Java objects into SQL
# commands) also needs to know it's speaking to SQLite, so it uses the
# correct grammar/syntax for things like auto-incrementing IDs.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# ---------------------------------------------------------------------
# TABLE CREATION BEHAVIOR
# ---------------------------------------------------------------------

# "update" tells Hibernate: "look at my @Entity classes (like Task.java)
# and automatically create or update database tables to match them."
# This is why you never had to manually write "CREATE TABLE task (...)"
# yourself - Hibernate did it for you the first time the app ran.
#
# Other options you may see in tutorials:
#   create      -> wipes and recreates tables every restart (data lost!)
#   create-drop -> same as create, but also deletes tables on shutdown
#   validate    -> checks tables match the code, but never changes them
#   none        -> does nothing automatically (safest for production)
spring.jpa.hibernate.ddl-auto=update

# ---------------------------------------------------------------------
# DEBUGGING / LEARNING HELPER
# ---------------------------------------------------------------------

# When true, every SQL command Hibernate runs behind the scenes gets
# printed in your terminal. This is very useful while learning, since
# you can see exactly what database operations your code triggers.
# Turn this to false later if the terminal output feels too noisy.
spring.jpa.show-sql=true




# tasks.db — a file that will be created in your project folder (this IS your database)
# ddl-auto=update — Spring will auto-create the table for you based on your Task class
# show-sql=true — prints the SQL commands in terminal, helpful for learning